<!DOCTYPE html>
<html lang="de">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double&family=Merriweather:wght@300;400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💙 Für Pebbli 💙</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #422833; color: #a66f86; font-family: 'Merriweather', serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 16px; }
    h1 { color: #c9d1d9; font-family: 'Bitcount Grid Double', sans-serif; font-size: clamp(24px, 6vw, 56px); text-align: center; margin-bottom: 32px; }
    .otter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; width: 100%; max-width: 700px; justify-items: center; align-items: center; }
    .otter-grid a { display: flex; justify-content: center; align-items: center; width: 100%; }
    .otter-grid img { width: 100%; max-width: 280px; height: auto; object-fit: contain; transition: transform 0.2s ease; }
    .otter-grid img:hover { transform: scale(1.05); }
    @media (max-width: 600px) { .otter-grid { gap: 16px; } .otter-grid img { max-width: 160px; } }
    @media (max-width: 380px) { .otter-grid { grid-template-columns: 1fr; } .otter-grid img { max-width: 220px; } }
  </style>
</head>
<body>
  <h1>💙 Für Pebbli 💙</h1>
  <div class="otter-grid">
    <a href="schlaf-gut.html">
      <img src="otter_schlafen-removebg-preview.png" alt="Schlaf gut">
    </a>
    <a href="#">
      <img src="otter_musik-removebg-preview.png" alt="Lieblingssong">
    </a>
    <a href="antennen-abenteuer.html">
      <img src="otter_laptop-removebg-preview.png" alt="Antennen-Abenteuer">
    </a>
    <a href="liebst-du-mich.html">
      <img src="otter_herz-removebg-preview.png" alt="Liebst du mich?">
    </a>
  </div>
</body>
</html>
