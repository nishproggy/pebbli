<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Werfen 🎯</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fdf6f0;
      --card: #ffffff;
      --text: #2d2320;
      --soft: #9c8480;
      --accent: #e05c7a;
      --shadow: rgba(224, 92, 122, 0.15);
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Lora', serif;
      overflow: hidden;
      user-select: none;
    }

    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 90%;
      max-width: 480px;
    }
    .screen.visible { display: flex; }

    .card {
      background: var(--card);
      border-radius: 28px;
      padding: 48px 40px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: cardIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }

    .card h1 { font-size: 28px; color: var(--text); }
    .card p { color: var(--soft); font-style: italic; font-size: 14px; line-height: 1.6; }

    .label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #f4a0b0;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .btn {
      padding: 14px 36px;
      border-radius: 50px;
      border: none;
      font-family: 'Lora', serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: white;
      box-shadow: 0 4px 16px rgba(224, 92, 122, 0.35);
      transition: transform 0.15s ease;
    }
    .btn:hover { transform: translateY(-2px); }

    .btn-secondary {
      background: #f5efee;
      color: var(--soft);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .highscore-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--soft);
    }
    .highscore-display span { color: var(--accent); font-weight: 600; }

    /* Game */
    #gameScreen {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      background: linear-gradient(180deg, #c8e6f0 0%, #e8f4f8 60%, #8bc34a 60%, #7cb342 100%);
    }
    #gameScreen.visible { display: flex; }

    .game-header {
      background: white;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 12px var(--shadow);
      z-index: 10;
      flex-shrink: 0;
    }

    .game-stat {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: var(--text);
    }
    .game-stat span { color: var(--accent); font-weight: 600; font-size: 18px; }

    .timer-bar-wrap { height: 6px; background: #f0e0e5; flex-shrink: 0; }
    .timer-bar { height: 100%; background: var(--accent); transition: width 1s linear; }

    #gameCanvas {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* Otter */
    #otterTarget {
      position: absolute;
      font-size: 56px;
      z-index: 5;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: default;
    }

    /* Throw item - fixed bottom center */
    #throwItem {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 44px;
      z-index: 5;
      cursor: grab;
      transition: transform 0.1s ease;
    }

    #throwItem:active { cursor: grabbing; transform: translateX(-50%) scale(1.2); }

    /* Projectile */
    .projectile {
      position: absolute;
      font-size: 40px;
      z-index: 6;
      pointer-events: none;
    }

    /* Score popup */
    .score-popup {
      position: absolute;
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 600;
      color: var(--accent);
      pointer-events: none;
      z-index: 20;
      animation: popUp 0.9s ease forwards;
    }

    @keyframes popUp {
      0%   { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-70px) scale(1.3); opacity: 0; }
    }

    /* Reaction bubble */
    #reaction {
      position: absolute;
      font-size: 36px;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    /* Hint */
    #hint {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--soft);
      z-index: 5;
      white-space: nowrap;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <!-- Start Screen -->
  <div class="screen visible" id="startScreen">
    <div class="card">
      <span class="label">// wurfspiel</span>
      <h1>Wirf dem Otter etwas zu! 🦦</h1>
      <p>Finger auf den Gegenstand legen, in Richtung Otter ziehen und loslassen!<br><br>
      🐟 Fisch = 10 Punkte &nbsp;|&nbsp; 💙 Herz = 20 Punkte</p>
      <div class="highscore-display">Highscore: <span id="startHighscore">0</span> Punkte</div>
      <button class="btn" onclick="startGame()">Los geht's! 🎯</button>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="gameScreen">
    <div class="game-header">
      <div class="game-stat">🎯 <span id="scoreDisplay">0</span></div>
      <div class="game-stat" style="font-size:13px; color:var(--soft); font-style:italic;">Wirf dem Otter zu!</div>
      <div class="game-stat">⏱ <span id="timerDisplay">30</span>s</div>
    </div>
    <div class="timer-bar-wrap">
      <div class="timer-bar" id="timerBar" style="width:100%"></div>
    </div>
    <div id="gameCanvas">
      <div id="otterTarget">🦦</div>
      <div id="throwItem">🐟</div>
      <div id="reaction"></div>
      <div id="hint">zieh in Richtung Otter & lass los</div>
    </div>
  </div>

  <!-- End Screen -->
  <div class="screen" id="endScreen">
    <div class="card">
      <span class="label">// game over</span>
      <h1>Zeit! 🎯</h1>
      <p id="endMessage"></p>
      <div class="game-stat" style="font-size:36px;" id="endScore"></div>
      <div class="highscore-display">Highscore: <span id="endHighscore">0</span> Punkte</div>
      <button class="btn" onclick="startGame()">Nochmal! 🎮</button>
      <button class="btn btn-secondary" onclick="goBack()">Zurück 💙</button>
    </div>
  </div>

  <script>
    let score = 0;
    let highscore = 0;
    let timeLeft = 30;
    let timerInterval = null;
    let isFlying = false;
    let isDragging = false;
    let dragStartX, dragStartY;
    let currentItem = '🐟';
    let hintShown = false;

    const canvas = document.getElementById('gameCanvas');
    const otterEl = document.getElementById('otterTarget');
    const throwItem = document.getElementById('throwItem');
    const reactionEl = document.getElementById('reaction');
    const hintEl = document.getElementById('hint');

    function placeOtter() {
      const cw = canvas.offsetWidth;
      const ch = canvas.offsetHeight;
      const margin = 80;
      const x = margin + Math.random() * (cw - margin * 2);
      const y = margin + Math.random() * (ch * 0.55);
      otterEl.style.left = (x - 28) + 'px';
      otterEl.style.top = (y - 28) + 'px';
    }

    function getThrowOrigin() {
      const rect = throwItem.getBoundingClientRect();
      const canvasRect = canvas.getBoundingClientRect();
      return {
        x: rect.left + rect.width / 2 - canvasRect.left,
        y: rect.top + rect.height / 2 - canvasRect.top
      };
    }

    function startGame() {
      score = 0;
      timeLeft = 30;
      isFlying = false;
      hintShown = false;
      currentItem = '🐟';

      document.getElementById('scoreDisplay').textContent = '0';
      document.getElementById('timerDisplay').textContent = '30';
      document.getElementById('timerBar').style.width = '100%';
      throwItem.textContent = currentItem;
      throwItem.style.opacity = '1';
      otterEl.textContent = '🦦';
      reactionEl.style.opacity = '0';
      hintEl.style.opacity = '0.7';

      document.getElementById('startScreen').classList.remove('visible');
      document.getElementById('endScreen').classList.remove('visible');
      document.getElementById('gameScreen').classList.add('visible');

      setTimeout(() => placeOtter(), 100);

      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timerDisplay').textContent = timeLeft;
        document.getElementById('timerBar').style.width = (timeLeft / 30 * 100) + '%';
        if (timeLeft <= 0) endGame();
      }, 1000);

      setupControls();
    }

    function setupControls() {
      throwItem.addEventListener('touchstart', onTouchStart, { passive: true });
      window.addEventListener('touchmove', onTouchMove, { passive: true });
      window.addEventListener('touchend', onTouchEnd);
      throwItem.addEventListener('mousedown', onMouseDown);
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
    }

    function onTouchStart(e) {
      if (isFlying) return;
      isDragging = true;
      dragStartX = e.touches[0].clientX;
      dragStartY = e.touches[0].clientY;
      if (!hintShown) { hintEl.style.opacity = '0'; hintShown = true; }
    }

    function onTouchMove(e) { /* just track */ }

    function onTouchEnd(e) {
      if (!isDragging) return;
      isDragging = false;
      const endX = e.changedTouches[0].clientX;
      const endY = e.changedTouches[0].clientY;
      const dx = endX - dragStartX;
      const dy = endY - dragStartY;
      const dist = Math.hypot(dx, dy);
      if (dist < 15) return;
     const speed = Math.min(dist * 0.03, 1.5);
      const vx = (dx / dist) * speed * 14;
      const vy = (dy / dist) * speed * 14;
      const origin = getThrowOrigin();
      throwProjectile(origin.x, origin.y, vx, vy);
    }

    function onMouseDown(e) {
      if (isFlying) return;
      isDragging = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      if (!hintShown) { hintEl.style.opacity = '0'; hintShown = true; }
    }

    function onMouseMove(e) { /* just track */ }

    function onMouseUp(e) {
      if (!isDragging) return;
      isDragging = false;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      const dist = Math.hypot(dx, dy);
      if (dist < 10) return;
      const speed = Math.min(dist * 0.018, 0.9);
      const vx = (dx / dist) * speed * 14;
      const vy = (dy / dist) * speed * 14;
      const origin = getThrowOrigin();
      throwProjectile(origin.x, origin.y, vx, vy);
    }

    function throwProjectile(sx, sy, vx, vy) {
      if (isFlying || timeLeft <= 0) return;
      isFlying = true;
      throwItem.style.opacity = '0.3';

      const proj = document.createElement('div');
      proj.className = 'projectile';
      proj.textContent = currentItem;
      proj.style.left = sx + 'px';
      proj.style.top = sy + 'px';
      canvas.appendChild(proj);

      let px = sx, py = sy;
      let pvx = vx, pvy = vy;
      const gravity = 0.25;

      const otterRect = otterEl.getBoundingClientRect();
      const canvasRect = canvas.getBoundingClientRect();
      const otterCX = otterRect.left - canvasRect.left + otterRect.width / 2;
      const otterCY = otterRect.top - canvasRect.top + otterRect.height / 2;

      const anim = setInterval(() => {
        px += pvx;
        py += pvy;
        pvy += gravity;

        proj.style.left = (px - 20) + 'px';
        proj.style.top = (py - 20) + 'px';

        // Hit check
        const dist = Math.hypot(px - otterCX, py - otterCY);
        if (dist < 52) {
          clearInterval(anim);
          proj.remove();
          onHit(px, py);
          return;
        }

        // Out of bounds
        if (px > canvas.offsetWidth + 80 || py > canvas.offsetHeight + 80 || px < -80 || py < -80) {
          clearInterval(anim);
          proj.remove();
          onMiss();
        }
      }, 16);
    }

    function onHit(px, py) {
      const points = currentItem === '💙' ? 20 : 10;
      score += points;
      document.getElementById('scoreDisplay').textContent = score;

      // Popup
      const popup = document.createElement('div');
      popup.className = 'score-popup';
      popup.textContent = '+' + points + (currentItem === '💙' ? ' 💙' : ' 🐟');
      popup.style.left = (px - 30) + 'px';
      popup.style.top = (py - 30) + 'px';
      canvas.appendChild(popup);
      setTimeout(() => popup.remove(), 900);

      // Otter reaction
      otterEl.textContent = currentItem === '💙' ? '🥹' : '😋';
      reactionEl.textContent = currentItem === '💙' ? '💙' : '🎉';
      const oRect = otterEl.getBoundingClientRect();
      const cRect = canvas.getBoundingClientRect();
      reactionEl.style.left = (oRect.left - cRect.left + 50) + 'px';
      reactionEl.style.top = (oRect.top - cRect.top - 20) + 'px';
      reactionEl.style.opacity = '1';

      setTimeout(() => {
        otterEl.textContent = '🦦';
        reactionEl.style.opacity = '0';
        placeOtter();
        nextThrow();
      }, 700);
    }

    function onMiss() {
      otterEl.textContent = '😢';
      reactionEl.textContent = '😢';
      const oRect = otterEl.getBoundingClientRect();
      const cRect = canvas.getBoundingClientRect();
      reactionEl.style.left = (oRect.left - cRect.left + 50) + 'px';
      reactionEl.style.top = (oRect.top - cRect.top - 20) + 'px';
      reactionEl.style.opacity = '1';

      setTimeout(() => {
        otterEl.textContent = '🦦';
        reactionEl.style.opacity = '0';
        nextThrow();
      }, 500);
    }

    function nextThrow() {
      // 40% chance of heart
      currentItem = Math.random() < 0.4 ? '💙' : '🐟';
      throwItem.textContent = currentItem;
      throwItem.style.opacity = '1';
      isFlying = false;
    }

    function endGame() {
      clearInterval(timerInterval);
      isFlying = true;

      if (score > highscore) highscore = score;

      document.getElementById('gameScreen').classList.remove('visible');
      document.getElementById('endScreen').classList.add('visible');
      document.getElementById('endScore').textContent = score + ' Punkte';
      document.getElementById('endHighscore').textContent = highscore;
      document.getElementById('startHighscore').textContent = highscore;

      let msg = '';
      if (score >= 200) msg = 'Weltklasse! Der Otter ist begeistert! 🥹💙';
      else if (score >= 120) msg = 'Sehr gut! Fast perfekter Wurf! 🎯';
      else if (score >= 60) msg = 'Nicht schlecht! Übung macht den Meister! 😊';
      else msg = 'Der Otter wartet noch auf sein Essen... 😢';
      document.getElementById('endMessage').textContent = msg;
    }

    function goBack() { window.history.back(); }
  </script>
</body>
</html>
