<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Werfen 🎯</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fdf6f0;
      --card: #ffffff;
      --text: #2d2320;
      --soft: #9c8480;
      --accent: #e05c7a;
      --shadow: rgba(224, 92, 122, 0.15);
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Lora', serif;
      overflow: hidden;
      user-select: none;
    }

    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 90%;
      max-width: 480px;
    }
    .screen.visible { display: flex; }

    .card {
      background: var(--card);
      border-radius: 28px;
      padding: 48px 40px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: cardIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }

    .card h1 { font-size: 28px; color: var(--text); }
    .card p { color: var(--soft); font-style: italic; font-size: 14px; line-height: 1.6; }

    .label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #f4a0b0;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .btn {
      padding: 14px 36px;
      border-radius: 50px;
      border: none;
      font-family: 'Lora', serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: white;
      box-shadow: 0 4px 16px rgba(224, 92, 122, 0.35);
      transition: transform 0.15s ease;
    }
    .btn:hover { transform: translateY(-2px); }

    .btn-secondary {
      background: #f5efee;
      color: var(--soft);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .highscore-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--soft);
    }
    .highscore-display span { color: var(--accent); font-weight: 600; }

    /* Game */
    #gameScreen {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      background: #e8f4f8;
    }
    #gameScreen.visible { display: flex; }

    .game-header {
      background: white;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 12px var(--shadow);
      z-index: 10;
      flex-shrink: 0;
    }

    .game-stat {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: var(--text);
    }
    .game-stat span { color: var(--accent); font-weight: 600; font-size: 18px; }

    .timer-bar-wrap { height: 6px; background: #f0e0e5; flex-shrink: 0; }
    .timer-bar { height: 100%; background: var(--accent); transition: width 1s linear; }

    /* Canvas area */
    #gameCanvas {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* Sky background */
    #gameCanvas::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #c8e6f0 0%, #e8f4f8 60%, #8bc34a 60%, #7cb342 100%);
    }

    /* Otter target */
    #otterTarget {
      position: absolute;
      right: 60px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 64px;
      z-index: 5;
      transition: all 0.2s ease;
    }

    /* Throw zone */
    #throwZone {
      position: absolute;
      left: 40px;
      bottom: 30%;
      font-size: 48px;
      z-index: 5;
      cursor: crosshair;
    }

    /* Aim line */
    #aimCanvas {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    /* Projectile */
    .projectile {
      position: absolute;
      font-size: 32px;
      z-index: 6;
      pointer-events: none;
    }

    /* Reaction */
    #reaction {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 40px;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    /* Score popup */
    .score-popup {
      position: absolute;
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 600;
      color: var(--accent);
      pointer-events: none;
      z-index: 20;
      animation: popUp 1s ease forwards;
    }

    @keyframes popUp {
      0%   { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-60px); opacity: 0; }
    }

    /* Drag arrow */
    #dragGuide {
      position: absolute;
      left: 40px;
      bottom: calc(30% + 60px);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--soft);
      z-index: 5;
      text-align: center;
      width: 80px;
    }

    /* Next item indicator */
    #nextItem {
      position: absolute;
      left: 110px;
      bottom: calc(30% + 10px);
      font-size: 24px;
      z-index: 5;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <!-- Start Screen -->
  <div class="screen visible" id="startScreen">
    <div class="card">
      <span class="label">// wurfspiel</span>
      <h1>Wirf dem Otter etwas zu! 🦦</h1>
      <p>Klicke auf den Gegenstand, ziehe zurück und lass los!<br>
      🐟 Fisch = 10 Punkte &nbsp;|&nbsp; 💙 Herz = 20 Punkte</p>
      <div class="highscore-display">Highscore: <span id="startHighscore">0</span> Punkte</div>
      <button class="btn" onclick="startGame()">Los geht's! 🎯</button>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="gameScreen">
    <div class="game-header">
      <div class="game-stat">🎯 <span id="scoreDisplay">0</span></div>
      <div class="game-stat" style="font-size:13px; color:var(--soft); font-style:italic;">Wirf dem Otter zu!</div>
      <div class="game-stat">⏱ <span id="timerDisplay">30</span>s</div>
    </div>
    <div class="timer-bar-wrap">
      <div class="timer-bar" id="timerBar" style="width:100%"></div>
    </div>
    <div id="gameCanvas">
      <canvas id="aimCanvas"></canvas>
      <div id="otterTarget">🦦</div>
      <div id="throwZone">🐟</div>
      <div id="nextItem"></div>
      <div id="dragGuide">← zieh & lass los</div>
      <div id="reaction"></div>
    </div>
  </div>

  <!-- End Screen -->
  <div class="screen" id="endScreen">
    <div class="card">
      <span class="label">// game over</span>
      <h1>Zeit! 🎯</h1>
      <p id="endMessage"></p>
      <div class="game-stat" style="font-size:36px;" id="endScore"></div>
      <div class="highscore-display">Highscore: <span id="endHighscore">0</span> Punkte</div>
      <button class="btn" onclick="startGame()">Nochmal! 🎮</button>
      <button class="btn btn-secondary" onclick="goBack()">Zurück 💙</button>
    </div>
  </div>

  <script>
    let score = 0;
    let highscore = 0;
    let timeLeft = 30;
    let timerInterval = null;
    let isDragging = false;
    let startX, startY, currentX, currentY;
    let currentItem = '🐟';
    let nextItem = '💙';
    let isFlying = false;

    const canvas = document.getElementById('gameCanvas');
    const aimCanvas = document.getElementById('aimCanvas');
    const ctx = aimCanvas.getContext('2d');
    const throwZone = document.getElementById('throwZone');
    const otterEl = document.getElementById('otterTarget');
    const reactionEl = document.getElementById('reaction');
    const nextItemEl = document.getElementById('nextItem');

    function resizeCanvas() {
      aimCanvas.width = canvas.offsetWidth;
      aimCanvas.height = canvas.offsetHeight;
    }

    function startGame() {
      score = 0;
      timeLeft = 30;
      isFlying = false;
      currentItem = Math.random() < 0.5 ? '🐟' : '💙';
      nextItem = Math.random() < 0.5 ? '🐟' : '💙';

      document.getElementById('scoreDisplay').textContent = '0';
      document.getElementById('timerDisplay').textContent = '30';
      document.getElementById('timerBar').style.width = '100%';
      throwZone.textContent = currentItem;
      nextItemEl.textContent = nextItem;
      otterEl.textContent = '🦦';
      reactionEl.style.opacity = '0';

      document.getElementById('startScreen').classList.remove('visible');
      document.getElementById('endScreen').classList.remove('visible');
      document.getElementById('gameScreen').classList.add('visible');

      resizeCanvas();

      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timerDisplay').textContent = timeLeft;
        document.getElementById('timerBar').style.width = (timeLeft / 30 * 100) + '%';
        if (timeLeft <= 0) endGame();
      }, 1000);

      setupControls();
    }

    function setupControls() {
      throwZone.addEventListener('mousedown', startDrag);
      throwZone.addEventListener('touchstart', startDragTouch, { passive: true });
      window.addEventListener('mousemove', onDrag);
      window.addEventListener('touchmove', onDragTouch, { passive: true });
      window.addEventListener('mouseup', release);
      window.addEventListener('touchend', release);
    }

    function startDrag(e) {
      if (isFlying) return;
      isDragging = true;
      const rect = throwZone.getBoundingClientRect();
      startX = rect.left + rect.width / 2;
      startY = rect.top + rect.height / 2;
      currentX = e.clientX;
      currentY = e.clientY;
    }

    function startDragTouch(e) {
      if (isFlying) return;
      isDragging = true;
      const rect = throwZone.getBoundingClientRect();
      startX = rect.left + rect.width / 2;
      startY = rect.top + rect.height / 2;
      currentX = e.touches[0].clientX;
      currentY = e.touches[0].clientY;
    }

    function onDrag(e) {
      if (!isDragging) return;
      currentX = e.clientX;
      currentY = e.clientY;
      drawAim();
    }

    function onDragTouch(e) {
      if (!isDragging) return;
      currentX = e.touches[0].clientX;
      currentY = e.touches[0].clientY;
      drawAim();
    }

    function drawAim() {
      ctx.clearRect(0, 0, aimCanvas.width, aimCanvas.height);
      const canvasRect = canvas.getBoundingClientRect();
      const sx = startX - canvasRect.left;
      const sy = startY - canvasRect.top;
      const dx = currentX - canvasRect.left;
      const dy = currentY - canvasRect.top;

      // Velocity (inverted)
      const vx = (sx - dx) * 0.08;
      const vy = (sy - dy) * 0.08;

      // Draw dotted arc
      ctx.setLineDash([6, 8]);
      ctx.strokeStyle = 'rgba(224, 92, 122, 0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();

      let px = sx, py = sy;
      let pvx = vx, pvy = vy;
      ctx.moveTo(px, py);

      for (let i = 0; i < 20; i++) {
        px += pvx * 4;
        py += pvy * 4;
        pvy += 0.4; // gravity
        ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function release() {
      if (!isDragging) return;
      isDragging = false;
      ctx.clearRect(0, 0, aimCanvas.width, aimCanvas.height);

      const canvasRect = canvas.getBoundingClientRect();
      const sx = startX - canvasRect.left;
      const sy = startY - canvasRect.top;
      const dx = currentX - canvasRect.left;
      const dy = currentY - canvasRect.top;

      const dist = Math.hypot(dx - sx, dy - sy);
      if (dist < 10) return; // too short

      const vx = (sx - dx) * 0.08;
      const vy = (sy - dy) * 0.08;

      throwProjectile(sx, sy, vx, vy);
    }

    function throwProjectile(sx, sy, vx, vy) {
      if (isFlying || timeLeft <= 0) return;
      isFlying = true;

      const proj = document.createElement('div');
      proj.className = 'projectile';
      proj.textContent = currentItem;
      proj.style.left = sx + 'px';
      proj.style.top = sy + 'px';
      canvas.appendChild(proj);
      throwZone.style.opacity = '0.3';

      let px = sx, py = sy;
      let pvx = vx, pvy = vy;
      const gravity = 0.35;

      const otterRect = otterEl.getBoundingClientRect();
      const canvasRect = canvas.getBoundingClientRect();
      const otterX = otterRect.left - canvasRect.left + otterRect.width / 2;
      const otterY = otterRect.top - canvasRect.top + otterRect.height / 2;

      const anim = setInterval(() => {
        px += pvx * 3;
        py += pvy * 3;
        pvy += gravity;

        proj.style.left = px + 'px';
        proj.style.top = py + 'px';

        // Hit check
        const dist = Math.hypot(px - otterX, py - otterY);
        if (dist < 50) {
          clearInterval(anim);
          proj.remove();
          onHit();
          return;
        }

        // Out of bounds
        if (px > canvas.offsetWidth + 60 || py > canvas.offsetHeight + 60 || px < -60) {
          clearInterval(anim);
          proj.remove();
          onMiss();
        }
      }, 16);
    }

    function onHit() {
      const points = currentItem === '💙' ? 20 : 10;
      score += points;
      document.getElementById('scoreDisplay').textContent = score;

      // Score popup
      const popup = document.createElement('div');
      popup.className = 'score-popup';
      popup.textContent = '+' + points + (currentItem === '💙' ? ' 💙' : ' 🐟');
      const oRect = otterEl.getBoundingClientRect();
      const cRect = canvas.getBoundingClientRect();
      popup.style.left = (oRect.left - cRect.left) + 'px';
      popup.style.top = (oRect.top - cRect.top) + 'px';
      canvas.appendChild(popup);
      setTimeout(() => popup.remove(), 1000);

      // Otter reaction
      otterEl.textContent = currentItem === '💙' ? '🥹' : '😋';
      reactionEl.textContent = currentItem === '💙' ? '💙' : '🎉';
      reactionEl.style.opacity = '1';
      setTimeout(() => {
        otterEl.textContent = '🦦';
        reactionEl.style.opacity = '0';
      }, 800);

      nextThrow();
    }

    function onMiss() {
      otterEl.textContent = '😢';
      reactionEl.textContent = '😢';
      reactionEl.style.opacity = '1';
      setTimeout(() => {
        otterEl.textContent = '🦦';
        reactionEl.style.opacity = '0';
      }, 600);

      nextThrow();
    }

    function nextThrow() {
      currentItem = nextItem;
      nextItem = Math.random() < 0.4 ? '💙' : '🐟';
      throwZone.textContent = currentItem;
      nextItemEl.textContent = nextItem;
      throwZone.style.opacity = '1';
      isFlying = false;
    }

    function endGame() {
      clearInterval(timerInterval);
      isFlying = true;
      window.removeEventListener('mousemove', onDrag);
      window.removeEventListener('touchmove', onDragTouch);
      window.removeEventListener('mouseup', release);
      window.removeEventListener('touchend', release);

      if (score > highscore) highscore = score;

      document.getElementById('gameScreen').classList.remove('visible');
      document.getElementById('endScreen').classList.add('visible');
      document.getElementById('endScore').textContent = score + ' Punkte';
      document.getElementById('endHighscore').textContent = highscore;
      document.getElementById('startHighscore').textContent = highscore;

      let msg = '';
      if (score >= 200) msg = 'Weltklasse! Der Otter ist begeistert! 🥹💙';
      else if (score >= 120) msg = 'Sehr gut! Fast perfekter Wurf! 🎯';
      else if (score >= 60) msg = 'Nicht schlecht! Übung macht den Meister! 😊';
      else msg = 'Der Otter wartet noch auf sein Essen... 😢';
      document.getElementById('endMessage').textContent = msg;
    }

    function goBack() { window.history.back(); }

    window.addEventListener('resize', resizeCanvas);
  </script>
</body>
</html>
